openapi: 3.0.3
info:
  title: Reverb API
  version: 0.1.0
  description: >
    Reverb is a self-hosted music app unifying a Subsonic/Navidrome library,
    Spotify search, and spotDL one-click download. All paths are served under
    /api/v1. Session auth is a cookie issued by /setup/admin or /auth/login;
    protected routes return 401 without it (unless auth is disabled via env).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Liveness probe
      responses: { "200": { description: ok } }
  /version:
    get:
      summary: Build version
      responses:
        "200":
          description: version string
          content:
            application/json:
              schema:
                type: object
                properties: { version: { type: string } }
  /openapi.yaml:
    get:
      summary: This OpenAPI document
      responses: { "200": { description: yaml } }
  /setup/status:
    get:
      summary: Whether first-run setup is required
      responses: { "200": { description: "{ setupRequired: bool }" } }
  /setup/admin:
    post:
      summary: Set the admin password during first-run setup
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { password: { type: string } }, required: [password] }
      responses: { "200": { description: session issued }, "400": { description: password required }, "409": { description: already set up } }
  /auth/login:
    post:
      summary: Log in with the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { password: { type: string } }, required: [password] }
      responses: { "200": { description: session issued }, "401": { description: invalid } }
  /auth/logout:
    post:
      summary: Invalidate the current session
      responses: { "200": { description: ok } }
  /me:
    get:
      summary: Current session check
      responses: { "200": { description: authenticated }, "401": { description: unauthorized } }
  /account/profile:
    patch:
      summary: Change the current user's username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { username: { type: string } }
              required: [username]
      responses: { "200": { description: updated }, "400": { description: invalid username }, "409": { description: username taken } }
  /account/password:
    post:
      summary: Change the current user's password
      responses: { "200": { description: updated }, "400": { description: invalid current or new password } }
  /adapters/available:
    get:
      summary: Registered adapter types with config schemas and capabilities
      responses: { "200": { description: ok } }
  /adapters:
    get:
      summary: List configured adapter instances (secrets redacted)
      responses: { "200": { description: ok }, "401": { description: unauthorized } }
    post:
      summary: Create an adapter instance
      responses: { "200": { description: created }, "400": { description: invalid } }
  /adapters/{id}:
    put:
      summary: Update an adapter instance
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: updated }, "404": { description: not found } }
    delete:
      summary: Delete an adapter instance
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: deleted }, "404": { description: not found } }
  /adapters/test:
    post:
      summary: Test an adapter configuration (TestConnection) without persisting
      responses: { "200": { description: "{ ok: bool, error?: string }" } }
  /settings:
    get:
      summary: Read app settings
      responses: { "200": { description: ok } }
    put:
      summary: Update app settings (sets the restart-to-apply flag)
      responses: { "200": { description: ok, pendingRestart flag included } }
  /config/pending-restart:
    get:
      summary: Whether config changed since startup (restart-to-apply banner)
      responses: { "200": { description: "{ pending: bool }" } }
  /library/search:
    get:
      summary: Fast REST search of the local library (tracks/albums/artists)
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: SearchResults } }
  /library/artists:
    get:
      summary: List library artists
      responses: { "200": { description: ok } }
  /library/artist/{id}:
    get:
      summary: One artist with albums
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "404": { description: not found } }
  /library/album/{id}:
    get:
      summary: One album with tracks
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "404": { description: not found } }
  /library/albums:
    get:
      summary: List albums
      parameters: [{ name: type, in: query, required: false, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /library/track/{id}/peaks:
    get:
      summary: Waveform peaks for a local track (computed on demand; embedded library only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: waveform data }, "204": { description: peaks unavailable } }
  /library/track/{id}/lyrics:
    get:
      summary: Lyrics for a track (local tags/sidecar → LRCLIB, DB-cached)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: artist, in: query, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: album, in: query, schema: { type: string } }
        - { name: durationMs, in: query, schema: { type: integer } }
      responses: { "200": { description: lyrics payload }, "204": { description: lyrics unavailable } }
  /collection:
    get:
      summary: Cached discography coverage summary
      responses: { "200": { description: collection summary } }
  /library/playlists:
    get:
      summary: List playlists
      responses: { "200": { description: ok } }
  /library/playlist/{id}:
    get:
      summary: One playlist with its tracks
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Playlist }, "404": { description: not found } }
    put:
      summary: Rename a playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses: { "200": { description: '{"ok":true}' }, "400": { description: name is required }, "502": { description: upstream error } }
    delete:
      summary: Delete a playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: '{"ok":true}' }, "502": { description: upstream error } }
  /library/playlist/{id}/remove:
    post:
      summary: Remove tracks at given zero-based indices from a playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                indices:
                  type: array
                  items: { type: integer }
              required: [indices]
      responses: { "200": { description: '{"ok":true}' }, "400": { description: indices is required }, "502": { description: upstream error } }
  /stream/{id}:
    get:
      summary: Stream/transcode-proxy a library track by id (Range supported)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: audio bytes }, "206": { description: partial content }, "404": { description: not found } }
  /cover/{id}:
    get:
      summary: Cover art proxy by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { type: integer } }
      responses: { "200": { description: image bytes } }
  /search/everywhere:
    get:
      summary: >
        Search-everywhere as Server-Sent Events. Streams one envelope per source
        (text/event-stream); each event data is a JSON SearchEnvelope with
        per-result library match status.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [track, album, artist] } }
      responses:
        "200":
          description: SSE stream of search envelopes
          content:
            text/event-stream:
              schema: { type: string }
  /artist/{source}/{id}:
    get:
      summary: External artist detail (bio, albums, related)
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: ArtistDetail }, "404": { description: not found } }
  /artist/{source}/{id}/coverage:
    get:
      summary: >
        SSE stream of album coverage status. Each event data is a JSON
        AlbumCoverage indicating whether each album is in the local library.
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: SSE stream of AlbumCoverage events
          content:
            text/event-stream:
              schema: { type: string }
  /album/{source}/{id}:
    get:
      summary: External album detail (tracks, metadata)
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: AlbumDetail }, "404": { description: not found } }
  /downloads:
    get:
      summary: List download jobs
      responses: { "200": { description: array of DownloadJob } }
    post:
      summary: Enqueue a one-click download (deduped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string }
                externalId: { type: string }
                artist: { type: string }
                title: { type: string }
                album: { type: string }
                isrc: { type: string }
                playWhenReady: { type: boolean }
              required: [source, externalId, artist, title]
      responses: { "200": { description: DownloadJob }, "400": { description: invalid } }
  /downloads/pause:
    post:
      summary: Pause the download queue (stop dispatching new jobs)
      responses: { "200": { description: "{paused:true}" } }
  /downloads/resume:
    post:
      summary: Resume the download queue
      responses: { "200": { description: "{paused:false}" } }
  /downloads/queue:
    get:
      summary: Queue state (paused flag)
      responses: { "200": { description: "{paused:boolean}" } }
  /downloads/clear:
    post:
      summary: Clear finished downloads (hard delete); body {ids?} else all finished
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { ids: { type: array, items: { type: string } } }
      responses: { "200": { description: "{removed:number}" } }
  /downloads/{id}/clear:
    post:
      summary: Clear a single finished download (hard delete)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "422": { description: job is active } }
  /downloads/{id}/cancel:
    post:
      summary: Cancel a queued/running download
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "404": { description: not found } }
  /downloads/{id}/retry:
    post:
      summary: Retry a failed/canceled download
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: DownloadJob }, "404": { description: not found } }
  /synced-playlists:
    get:
      summary: List imported (synced) playlists
      responses: { "200": { description: array of SyncedPlaylist }, "500": { description: store error }, "503": { description: playlist sync unavailable } }
    post:
      summary: Import a playlist by URL (idempotent on source+externalId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                downloadMissing: { type: boolean }
              required: [url]
      responses:
        "200": { description: SyncedPlaylistDetail }
        "400": { description: url is required }
        "422": { description: bad or inaccessible playlist URL }
        "503": { description: playlist sync unavailable }
  /synced-playlists/{id}:
    get:
      summary: Synced-playlist detail with live per-track ownership
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: SyncedPlaylistDetail }
        "404": { description: not found }
        "503": { description: playlist sync unavailable }
    delete:
      summary: Delete a synced playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "503": { description: playlist sync unavailable } }
  /synced-playlists/{id}/sync:
    post:
      summary: Re-fetch the playlist from its source now
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: SyncedPlaylistDetail }
        "422": { description: sync failed }
        "503": { description: playlist sync unavailable }
  /synced-playlists/{id}/download-missing:
    post:
      summary: Enqueue downloads for the playlist's missing tracks
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: array of DownloadJob }
        "422": { description: could not enqueue }
        "503": { description: playlist sync unavailable }
  /synced-playlists/{id}/settings:
    put:
      summary: Update auto-sync schedule + auto-download for a synced playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                syncEnabled: { type: boolean }
                intervalSec: { type: integer }
                autoDownload: { type: boolean }
      responses:
        "200": { description: ok }
        "422": { description: update failed }
        "503": { description: playlist sync unavailable }
  /downloads/batch:
    post:
      summary: Enqueue multiple downloads in one request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tracks:
                  type: array
                  items:
                    type: object
                    properties:
                      source: { type: string }
                      externalId: { type: string }
                      artist: { type: string }
                      title: { type: string }
                      album: { type: string }
                      isrc: { type: string }
                    required: [source, externalId, artist, title]
              required: [tracks]
      responses: { "200": { description: array of DownloadJob }, "400": { description: invalid } }
  /plays:
    post:
      summary: >
        Record a play for the session user. The player sends it once the song
        qualifies (half its length or four minutes), and it is queued for
        scrobbling. Body fields are PascalCase (LibraryTrackID, Title, Artist,
        Album, ISRC, DurationMs, MsPlayed, Completed, PlayedAt).
      responses:
        "200": { description: "{id: string} — the new play's id, for PATCH /plays/{id}" }
        "400": { description: invalid request body }
        "503": { description: play service unavailable }
  /plays/{id}:
    patch:
      summary: >
        Record how much of a play was finally heard ({MsPlayed, Completed}).
        Values only rise. Owner-scoped: another user's id is a silent no-op.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: ok }, "400": { description: invalid request body } }
    delete:
      summary: Delete one of the session user's plays (owner-scoped, idempotent)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: ok } }
  /stats/timeline:
    get:
      summary: >
        Plays and listened time per day, week or month in [from, to). Buckets
        follow the listener's calendar: tzOffsetMinutes (minutes east of UTC)
        sets local midnight, and Start is that instant. Empty buckets are omitted.
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: bucket, in: query, schema: { type: string, enum: [day, week, month] } }
        - { name: tzOffsetMinutes, in: query, schema: { type: integer } }
      responses: { "200": { description: "array of {Start, Plays, MsPlayed}" } }
  /listens:
    post:
      summary: >
        Record how one started track ended for the session user (taste signal).
        Unlike /plays (scrobble-qualified plays only), every outcome is stored,
        including skips. contextKind/contextId say where it was played from
        (album, playlist, radio, dj, mix, ...).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libraryTrackId: { type: string }
                title: { type: string }
                artist: { type: string }
                album: { type: string }
                isrc: { type: string }
                durationMs: { type: integer }
                msPlayed: { type: integer }
                outcome: { type: string, enum: [completed, skip_early, skip_late, stopped] }
                contextKind: { type: string }
                contextId: { type: string }
                startedAt: { type: integer, description: unix seconds; 0 or omitted = now }
              required: [title, artist, msPlayed, outcome]
      responses: { "204": { description: recorded }, "400": { description: invalid }, "503": { description: taste service unavailable } }
  /taste/profile:
    get:
      summary: The session user's top artists and tracks by taste score, plus counts.
      responses: { "200": { description: "{ topArtists, topTracks, trackCount, artistCount, hiddenTracks, hiddenArtists }" } }
  /taste/feedback:
    get:
      summary: The session user's thumbs-downs, newest first.
      responses: { "200": { description: "array of { targetKind, targetKey, label, sublabel, libraryId, createdAt }" } }
    put:
      summary: >
        Thumbs-down a track ("not this song") or an artist ("less of this
        artist"). Track feedback needs the track's metadata; artist feedback
        needs only artist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetKind: { type: string, enum: [track, artist] }
                libraryTrackId: { type: string }
                libraryArtistId: { type: string }
                title: { type: string }
                artist: { type: string }
                album: { type: string }
                isrc: { type: string }
                durationMs: { type: integer }
              required: [targetKind, artist]
      responses: { "200": { description: the stored feedback row }, "400": { description: invalid } }
  /taste/feedback/{kind}/{key}:
    delete:
      summary: Undo a thumbs-down. kind is track or artist; key is the row's targetKey (percent-encoded).
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [track, artist] } }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses: { "204": { description: removed (or was not present) } }
  /artists/similar:
    get:
      summary: >
        Artists similar to the named one ("fans also like"), best first, from
        the recommendation index's artist-similarity map. Each entry says how
        many tracks the library owns (0 = not in the library) and, when owned,
        the library artist id.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: "{ artist, similar: [{ key, name, source, externalId, imageUrl, rank, ownedTracks, libraryArtistId }] }" }, "400": { description: name missing } }
  /engine/index:
    get:
      summary: Recommendation index status (managers). Tracks and artists indexed, artists with a similarity list, last run.
      responses: { "200": { description: "{ running, tracks, artists, artistsWithSimilar, lastIndexedAt, lastError }" }, "403": { description: not a manager } }
  /engine/index/rebuild:
    post:
      summary: Queue a re-index of the library and similarity map now (managers).
      responses: { "202": { description: queued }, "403": { description: not a manager } }
  /ws:
    get:
      summary: >
        WebSocket of live events. Each frame is JSON { type, payload } where type
        is the EventBus topic (download.queued, download.progress,
        download.complete, download.failed, library.updated). Used by the client
        to flip a result to in-library, drive progress rings, and resync.
      responses:
        "101": { description: Switching Protocols (WebSocket upgrade) }
        "401": { description: unauthorized }
  /dj/voice:
    get:
      summary: Whether the DJ has a voice configured, and which provider
      responses:
        "200": { description: '{"available":bool,"name":string}; name is "" when no voice is enabled' }
  /dj/say:
    post:
      summary: >
        Render a DJ line with the active voice provider (cached by voice and
        text) and return a clip URL. Rate-limited per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 600 }
              required: [text]
      responses:
        "200": { description: '{"id":string,"url":"/api/v1/dj/clips/{id}"}' }
        "400": { description: text empty or longer than 600 characters }
        "429": { description: too many lines this minute }
        "502": { description: the voice provider failed }
        "503": { description: no voice is configured, or the built-in voice is still being set up (Retry-After) }
  /dj/clips/{id}:
    get:
      summary: A rendered DJ voice clip (immutable; audio/*)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: audio bytes }, "404": { description: clip not found } }
