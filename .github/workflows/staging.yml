name: Staging Image

# Publishes ghcr.io/<owner>/reverb:staging from the `staging` branch so changes
# can be run in a real container before they are released.
#
# Triggers:
#   - Push to `staging` (a merged pull request): publish that commit.
#   - Weekly schedule: rebuild the current staging head even with no new
#     commits, so yt-dlp (floated at image-build time, see the Dockerfile) never
#     goes stale the way it did when images were only built on release (#20).
#   - Manual dispatch: rebuild on demand, e.g. right after YouTube breaks yt-dlp.
#
# CI runs on the pull request, not again on the merge. As with releases, a
# commit is never published without passing CI: if the pull request's passing
# CI run doesn't cover the merged code exactly (see
# .github/scripts/ci-verified.sh), CI runs here first and the build waits on it.
# Note: `schedule` only fires from the copy of this file on the default branch;
# `push` uses the copy on staging, so keep both in sync.
on:
  push:
    branches: [staging]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: staging-image
  cancel-in-progress: true

jobs:
  verify:
    name: Resolve staging commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      short: ${{ steps.source.outputs.short }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - id: source
        name: Resolve the commit to publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          if [ -n "$PUSH_SHA" ]; then
            sha="$PUSH_SHA"
          else
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/staging" --jq .sha)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
      - id: tested
        name: Check whether CI already passed for this code
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: echo "tested=$(.github/scripts/ci-verified.sh "$SHA")" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify
    if: needs.verify.outputs.tested != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}

  build-amd64:
    name: Build & Push AMD64
    needs: [verify, ci]
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/reverb:build-staging-${{ needs.verify.outputs.sha }}-amd64
          cache-from: type=gha,scope=reverb-amd64
          cache-to: type=gha,scope=reverb-amd64,mode=max
          # A per-run stamp forces the yt-dlp layer to rebuild every time.
          build-args: |
            VERSION=staging-${{ needs.verify.outputs.short }}
            YTDLP_BUILD_STAMP=${{ github.run_id }}
          provenance: true

  build-arm64:
    name: Build & Push ARM64
    needs: [verify, ci]
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/reverb:build-staging-${{ needs.verify.outputs.sha }}-arm64
          cache-from: type=gha,scope=reverb-arm64
          cache-to: type=gha,scope=reverb-arm64,mode=max
          build-args: |
            VERSION=staging-${{ needs.verify.outputs.short }}
            YTDLP_BUILD_STAMP=${{ github.run_id }}
          provenance: true

  publish-manifest:
    name: Publish multi-arch staging image
    needs: [verify, build-amd64, build-arm64]
    if: >-
      !cancelled() && needs.build-amd64.result == 'success' &&
      needs.build-arm64.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image manifest
        env:
          SHORT: ${{ needs.verify.outputs.short }}
          AMD64: ${{ needs.build-amd64.outputs.digest }}
          ARM64: ${{ needs.build-arm64.outputs.digest }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/reverb"
          # `staging` moves with the branch; `staging-<sha>` pins one build so a
          # regression can be bisected or rolled back to.
          docker buildx imagetools create \
            -t "${image}:staging" \
            -t "${image}:staging-${SHORT}" \
            "${image}@${AMD64}" \
            "${image}@${ARM64}"
